<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabWorld (หมวดศัพท์การเขียนโค้ด) (Coding)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="custom.css" rel="stylesheet">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <style>
        /* CSS สำหรับ Navbar 3D */
        .navbar-3d {
            background-color: #007bff; /* เปลี่ยนสีพื้นหลังตามต้องการ */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .navbar-3d .nav-link {
            transition: transform 0.3s;
        }
        .navbar-3d .nav-link:hover {
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Navbar -->
    <header class="d-flex flex-wrap justify-content-center py-3 mb-4 border-bottom navbar-3d">
        <ul class="nav">
            <li><a href="index.html" class="nav-link px-2 text-white">หน้าแรก</a></li>
            <li><a href="business.html" class="nav-link px-2 text-white">หมวดธุรกิจ</a></li>
            <li><a href="computing.html" class="nav-link px-2 text-white">หมวดคอมพิวเตอร์</a></li>
            <li><a href="coding.html" class="nav-link px-2">หมวดการเขียนโปรแกรม</a></li>
            <li><a href="Law.html" class="nav-link px-2">หมวดศัพท์กฎหมายดิจิทัล</a></li>
        </ul>
    </header>

    <div class="mt-5">
        <h2>หมวดศัพท์การเขียนโค้ด (Coding)</h2>
        <form id="searchForm" class="mt-3">
            <div class="mb-3">
                <label for="searchWord" class="form-label">ค้นหาคำศัพท์:</label>
                <input type="text" class="form-control" id="searchWord" placeholder="กรอกคำศัพท์ที่คุณต้องการค้นหา">
            </div>
            <button type="submit" class="btn btn-primary">ค้นหา</button>
        </form>

        <!-- Modal -->
        <div class="modal fade" id="resultModal" tabindex="-1" aria-labelledby="resultModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="resultModalLabel">ผลลัพธ์การค้นหา</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <p id="modalContent">ผลลัพธ์จะแสดงที่นี่</p>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">ปิด</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="code.js"></script>
</body>
</html>
